# Used by Forge and by NeoForge 1.20.4. NeoForge 1.20.5+ reads neoforge.mods.toml instead.
modLoader="javafml"
loaderVersion="[1,)"
license="${license}"
issueTrackerURL="https://github.com/Hexeption/Minis/issues"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
authors="${authors}"
description='''${description}'''


[[dependencies.${id}]]
#? if forge {
modId="forge"
versionRange="[${forgeLoaderVersion},)"
#?} else {
modId="neoforge"
versionRange="${neoforgeVersionRange}"
#?}
#? if forge {
mandatory=true
#?} else {
type="required"
#?}
ordering="NONE"
side="BOTH"

[[dependencies.${id}]]
modId="minecraft"
#? if forge {
mandatory=true
#?} else {
type="required"
#?}
versionRange="[${minecraftVersion}]"
ordering="NONE"
side="BOTH"
